<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Finance: Data Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink: #0F172A;
    --ink-soft: #425168;
    --muted: #64748B;
    --faint: #94A3B8;
    --border: #E7EBF1;
    --border-soft: #F0F2F6;
    --surface: #FFFFFF;
    --canvas: #FFFFFF;
    --hover-tint: #F8FAFC;
    --pf-bg: #F1F5F9;
    --pf-fg: #475569;
    --pj-bg: #F3F4F6;
    --pj-fg: #6B7280;
    --mono: 'JetBrains Mono', Menlo, monospace;
  }

  body {
    display: flow-root;
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Inter, -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .preview { padding: 0; }

  /* ---------- raiz: fluida, não mais travada em 635px ---------- */
  .product-catalog {
    width: 100%;
    max-width: 760px;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 36px;
  }

  /* ---------- header ---------- */
  .catalog-intro { width: 100%; }

  .catalog-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #0047BB;
    margin: 0 0 10px;
  }

  .catalog-eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #0047BB;
  }

  .catalog-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin: 0;
    color: var(--ink);
  }

  .catalog-description {
    margin: 10px 0 0;
    max-width: 100%;
    color: var(--muted);
    font-size: 15.5px;
    line-height: 1.65;
  }

  /* ---------- categorias ---------- */
  .catalog-categories {
    display: flex;
    width: 100%;
    flex-direction: column;
    align-items: flex-start;
    /* Espaço compacto entre as superfícies de hover das categorias */
    gap: 8px;
  }

  .catalog-category {
    display: flex;
    width: fit-content;
    max-width: 100%;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    overflow: hidden;
    transition:
      width 0.18s cubic-bezier(0.22, 1, 0.36, 1),
      border-color 0.2s ease,
      background 0.2s ease;
  }

  .catalog-category.is-wide {
    width: 100%;
  }

  .category-header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    align-self: stretch;
    background: none;
    border: 0;
    padding: 4px 9px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    text-align: left;
  }

  .category-header:focus-visible {
    outline: none;
  }

  .category-header:focus-visible .category-summary {
    outline: 2px solid #0047BB;
    outline-offset: 2px;
  }

  .category-header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }

  .category-summary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 0;
    border: 0;
    background: transparent;
  }

  .category-summary > .chevron {
    margin-right: -4px;
  }

  .chevron {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--faint);
    transition: color 0.15s ease;
  }

  .category-icon {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    border: 0;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .category-icon svg { width: 16px; height: 16px; }

  .category-title {
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .category-count-badge {
    display: flex;
    padding: 2px 9px;
    align-items: center;
    border-radius: 111px;
    background: var(--border-soft);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .category-header:hover { background: var(--hover-tint); }
  .catalog-category:hover { border-color: #D7DEE8; }
  .category-header:hover .category-title { color: #0047BB; }
  .category-header:hover .chevron { color: var(--ink-soft); }

  .category-description {
    align-self: stretch;
    margin: 0;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.6;
    max-width: 62ch;
  }

  .category-body {
    display: grid;
    grid-template-rows: 0fr;
    width: 0;
    max-width: 0;
    align-self: flex-start;
    overflow: hidden;
    transition:
      grid-template-rows 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .category-body-inner {
    display: flex;
    min-height: 0;
    flex-direction: column;
    align-items: flex-start;
    gap: 22px;
    padding: 0 12px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition:
      padding 0.22s ease,
      opacity 0.16s ease,
      transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
      visibility 0s linear 0.28s;
  }

  .catalog-category.is-open .category-body {
    grid-template-rows: 1fr;
    width: 100%;
    max-width: 100%;
    align-self: stretch;
  }

  .catalog-category.is-open .category-body-inner {
    padding: 8px 12px 12px;
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    transition:
      padding 0.24s ease,
      opacity 0.2s ease 0.03s,
      transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
      visibility 0s;
  }

  /* ---------- agrupamento intermediário ---------- */
  .intermediate-group {
    display: flex;
    width: 100%;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .intermediate-group-title {
    display: flex;
    width: 100%;
    height: 38px;
    align-items: center;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-bottom: 0;
    border-radius: 12px 12px 0 0;
    background: var(--hover-tint);
    color: var(--faint);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .intermediate-group--titled {
    gap: 0;
  }

  .intermediate-group--titled .product-accordion-group {
    border-radius: 0 0 12px 12px;
  }

  /* ---------- grupo de accordions ---------- */
  .product-accordion-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    align-self: stretch;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: none;
    overflow: hidden;
  }

  .product-accordion {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    align-self: stretch;
  }

  .product-accordion + .product-accordion { border-top: 1px solid var(--border-soft); }

  .product-accordion-header {
    display: flex;
    padding: 10px 12px;
    align-items: center;
    gap: 12px;
    align-self: stretch;
    background: none;
    border: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
    text-align: left;
    position: relative;
  }

  .product-accordion-header::before {
    content: "";
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: #0047BB;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .product-accordion-header:hover { background: var(--hover-tint); }
  .product-accordion-header:hover::before { opacity: 1; }
  .product-accordion-header:hover .product-accordion-title { color: #0047BB; }
  .product-accordion-header:hover .chevron { color: var(--ink-soft); }

  .product-accordion-header:focus-visible {
    outline: 2px solid #0047BB;
    outline-offset: -2px;
  }

  .product-accordion-title {
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    transition: color 0.15s ease;
  }

  .data-product-chips {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .data-product-chip {
    display: flex;
    padding: 4px 9px;
    align-items: center;
    border-radius: 111px;
    font-family: var(--mono);
    font-size: 11.5px;
    white-space: nowrap;
  }

  .data-product-chip--pf { background: var(--pf-bg); color: var(--pf-fg); }
  .data-product-chip--pj { background: var(--pj-bg); color: var(--pj-fg); }

  /* ---------- conteúdo aberto ---------- */
  .product-accordion-content {
    display: flex;
    padding: 2px 12px 12px;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    align-self: stretch;
    background: #FFFFFF;
  }

  .product-accordion-content[hidden] { display: none; }

  .product-description {
    align-self: stretch;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.6;
    margin: 0;
    padding-left: 32px;
  }

  /* ---------- lista de produtos ---------- */
  .product-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    align-self: stretch;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    overflow: hidden;
  }

  .product-row {
    display: flex;
    align-items: center;
    gap: 12px;
    align-self: stretch;
    padding: 8px 12px;
    transition: background 0.1s ease;
  }

  .product-row + .product-row { border-top: 1px solid var(--border-soft); }
  .product-row:hover { background: var(--hover-tint); }

  .mini-chip {
    display: flex;
    width: 30px;
    padding: 3px 0;
    justify-content: center;
    align-items: center;
    border-radius: 111px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.01em;
    flex-shrink: 0;
  }

  .mini-chip--pf { background: var(--pf-bg); color: var(--pf-fg); }
  .mini-chip--pj { background: var(--pj-bg); color: var(--pj-fg); }

  .product-link-wrapper { display: flex; align-items: center; }

  .product-name {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 12px;
    text-decoration: none;
    border-radius: 4px;
  }

  .product-name:hover, .product-name:focus-visible { color: #0047BB; text-decoration: underline; }

  .product-name:focus-visible { outline: 2px solid #0047BB; outline-offset: 2px; }

  .external-link-icon { width: 11px; height: 11px; flex-shrink: 0; display: flex; opacity: 0.6; }

  /* ---------- metadados ---------- */
  .metadata-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 32px;
    flex-wrap: wrap;
  }

  .metadata-chip {
    display: flex;
    padding: 3px 10px;
    align-items: center;
    border-radius: 111px;
    background: var(--border-soft);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 500;
  }

  .level-chip { cursor: help; }

  .level-chip:focus-visible {
    outline: 2px solid #0047BB;
    outline-offset: 2px;
    border-radius: 111px;
  }

  /* ---------- tooltip: elemento único fora de qualquer overflow:hidden ---------- */
  .chip-tooltip {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    max-width: 240px;
    padding: 9px 11px;
    border-radius: 9px;
    background: var(--ink);
    color: #F1F5F9;
    font-family: Inter, sans-serif;
    font-size: 12px;
    line-height: 1.5;
    text-align: left;
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.22);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.12s ease;
  }

  .chip-tooltip.is-visible { opacity: 1; visibility: visible; }

  .chip-tooltip__arrow {
    position: absolute;
    bottom: -4px;
    width: 8px;
    height: 8px;
    background: var(--ink);
    transform: translateX(-50%) rotate(45deg);
  }

  /* ---------- componente grid pattern (hero) ---------- */
  .demo-label {
    font-size: 13px;
    font-weight: 600;
    color: #64748B;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
    align-self: flex-start;
    max-width: 700px;
    width: 100%;
  }

  .demo-wrap { width: 100%; max-width: 760px; margin: 0; }

  /* ---------- container base, igual aos três exemplos do demo.tsx ---------- */
  .grid-box {
    position: relative;
    display: flex;
    width: 100%;
    height: 360px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 12px;
    border: 1px solid #E2E8F0;
    background: #FFFFFF;
    
  }

  .grid-box__title {
    position: relative;
    z-index: 10;
    margin: 0;
    text-align: center;
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -0.03em;
    color: #0F172A;
    white-space: pre-wrap;
  }

  /* svg de fundo, sempre absoluto preenchendo o container */
  .grid-svg {
    pointer-events: none;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    fill: rgba(148, 163, 184, 0.3);
    stroke: rgba(148, 163, 184, 0.3);
  }

  /* Variante 1: skew + máscara radial + quadrados destacados */
  .grid-svg--skew {
    left: 0;
    right: 0;
    top: -30%;
    height: 160%;
    transform: skewY(-12deg);
    -webkit-mask-image: radial-gradient(400px circle at center, white, transparent);
    mask-image: radial-gradient(400px circle at center, white, transparent);
  }

  /* Variante 2: máscara linear (canto superior esquerdo pro inferior direito) */
  .grid-svg--linear {
    -webkit-mask-image: linear-gradient(to bottom right, white, transparent, transparent);
    mask-image: linear-gradient(to bottom right, white, transparent, transparent);
  }

  /* Variante 3: traço tracejado + máscara radial */
  .grid-svg--dashed {
    -webkit-mask-image: radial-gradient(300px circle at center, white, transparent);
    mask-image: radial-gradient(300px circle at center, white, transparent);
  }

  .grid-box__art {
    position: relative;
    z-index: 10;
    filter: drop-shadow(0 12px 28px rgba(15, 23, 42, 0.18));
  }

  .grid-box__art svg {
    display: block;
    width: 380px;
    height: auto;
    border-radius: 10px;
  }

  /* ---------- variação editorial em grid ---------- */
  :root {
    --grid-line: #E6EAF0;
    --grid-line-soft: #F0F2F5;
    --grid-surface: #FBFCFE;
  }

  html,
  body { background: transparent; }
  .demo-wrap {
    display: block;
    width: 100%;
    max-width: 960px;
    margin: 0 !important;
  }

  .catalog-frame {
    width: calc(100% - 8px);
    max-width: 960px;
    margin: 4px;
    border: 1px solid var(--grid-line);
    background: transparent;
    overflow: hidden;
  }

  .catalog-frame .demo-wrap,
  .catalog-frame .preview,
  .catalog-frame .product-catalog {
    max-width: none;
  }

  .catalog-frame .grid-box {
    border: 0;
    border-bottom: 1px solid var(--grid-line);
  }

  .catalog-frame .product-catalog {
    border: 0;
  }

  .grid-box {
    height: 300px;
    border: 1px solid var(--grid-line);
    border-bottom: 0;
    border-radius: 0;
    background-color: #FFFFFF;
    background-image: linear-gradient(
      to right,
      transparent 63px,
      var(--grid-line-soft) 63px,
      var(--grid-line-soft) 64px,
      transparent 64px,
      transparent calc(100% - 64px),
      var(--grid-line-soft) calc(100% - 64px),
      var(--grid-line-soft) calc(100% - 63px),
      transparent calc(100% - 63px)
    );
  }

  .grid-box::before,
  .grid-box::after {
    content: "";
    position: absolute;
    z-index: 5;
    top: 0;
    bottom: 0;
    width: 64px;
    background: #FFFFFF;
    pointer-events: none;
  }

  .grid-box::before {
    left: 0;
    border-right: 1px solid var(--grid-line-soft);
  }

  .grid-box::after {
    right: 0;
    border-left: 1px solid var(--grid-line-soft);
  }

  .grid-box__art { filter: drop-shadow(0 8px 18px rgba(15, 23, 42, 0.12)); }

  .preview {
    width: 100%;
    max-width: 960px;
    padding: 0;
  }

  .product-catalog {
    position: relative;
    width: 100%;
    max-width: 960px;
    gap: 0;
    align-items: stretch;
    border: 1px solid var(--grid-line);
    border-radius: 0;
    background-color: #FFFFFF;
    background-image: linear-gradient(
      to right,
      transparent 63px,
      var(--grid-line-soft) 63px,
      var(--grid-line-soft) 64px,
      transparent 64px,
      transparent calc(100% - 64px),
      var(--grid-line-soft) calc(100% - 64px),
      var(--grid-line-soft) calc(100% - 63px),
      transparent calc(100% - 63px)
    );
    box-shadow: none;
    overflow: hidden;
  }

  .catalog-intro {
    width: 100%;
    padding: 36px 80px 30px;
    border-bottom: 1px solid var(--grid-line);
    background: rgba(255, 255, 255, 0.94);
  }

  .catalog-eyebrow {
    color: #0047BB;
    font-size: 11px;
    letter-spacing: 0.09em;
  }

  .catalog-title {
    margin-top: 12px;
    color: var(--ink);
    font-size: clamp(26px, 4vw, 38px);
    line-height: 1.08;
    letter-spacing: -0.035em;
  }

  .catalog-description {
    max-width: 650px;
    margin-top: 14px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
  }

  .catalog-categories {
    width: 100%;
    gap: 0;
    padding: 0;
    background: transparent;
  }

  .catalog-category {
    width: 100% !important;
    max-width: 100%;
    border: 0;
    border-bottom: 1px solid var(--grid-line);
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }

  .catalog-category:last-child { border-bottom: 0; }

  .catalog-category:hover { border-color: var(--grid-line); }

  .catalog-category.is-wide {
    border-color: var(--grid-line);
  }

  .category-header {
    position: relative;
    height: 44px;
    min-height: 44px;
    justify-content: center;
    padding: 0 80px;
    border-radius: 0;
  }

  .category-header::after {
    content: "";
    position: absolute;
    z-index: 0;
    top: 0;
    right: 64px;
    bottom: 0;
    left: 64px;
    background: var(--grid-surface);
    opacity: 0;
    pointer-events: none;
  }

  .category-header:hover { background: transparent; }
  .category-header:hover::after { opacity: 1; }

  .category-header-top,
  .category-summary {
    position: relative;
    z-index: 1;
    width: 100%;
  }

  .category-summary {
    display: grid;
    grid-template-columns: 18px 26px minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 10px;
  }

  .category-summary > .chevron { margin-right: 0; }

  .category-icon {
    width: 26px;
    height: 26px;
    border-radius: 0;
  }

  .category-title {
    align-self: center;
    font-size: 14px;
    letter-spacing: -0.01em;
  }

  .category-count-badge {
    justify-self: end;
    align-self: center;
    min-width: 26px;
    justify-content: center;
    padding: 2px 7px;
    border: 1px solid var(--grid-line);
    border-radius: 999px;
    background: #FFFFFF;
    color: var(--muted);
    font-size: 11px;
  }

  .category-body {
    transition: grid-template-rows 0.18s cubic-bezier(0.2, 0, 0, 1);
  }

  .category-body-inner {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    gap: 16px;
    padding-block: 0;
    padding-inline: 80px;
    opacity: 0;
    visibility: hidden;
    transform: none;
    transition: opacity 0.1s linear, visibility 0s linear 0.18s;
  }

  .catalog-category.is-open .category-body-inner {
    padding-block: 0 24px;
    padding-inline: 80px;
    opacity: 1;
    visibility: visible;
    transform: none;
    transition: opacity 0.14s ease 0.04s, visibility 0s;
  }

  .category-description {
    max-width: none;
    padding: 18px 0 0;
    border-top: 1px solid var(--grid-line-soft);
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  .intermediate-group {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    gap: 0;
  }

  .intermediate-group + .intermediate-group {
    margin-top: 0;
  }

  .intermediate-group-title {
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--grid-line);
    border-bottom: 0;
    border-radius: 0;
    background: var(--grid-surface);
    color: var(--muted) !important;
    font-size: 10.5px;
    letter-spacing: 0.08em;
  }

  .product-accordion-group,
  .intermediate-group--titled .product-accordion-group {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    border: 1px solid var(--grid-line);
    border-radius: 0;
    background: #FFFFFF;
    box-shadow: none;
  }

  .product-accordion + .product-accordion {
    border-top: 1px solid var(--grid-line-soft);
  }

  .product-accordion-header {
    display: grid;
    grid-template-columns: 18px minmax(150px, 1fr) auto;
    min-height: 42px;
    padding: 8px 12px;
    gap: 10px;
    min-width: 0;
  }

  .product-accordion-header::before { display: none; }

  .product-accordion-header:hover { background: var(--grid-surface); }

  .product-accordion-title {
    font-size: 13px;
    line-height: 1.35;
  }

  .product-accordion-title-level { white-space: nowrap; }
  .product-accordion-title--with-level .product-accordion-title-level { display: block; }

  .data-product-chips {
    min-width: 0;
    max-width: 100%;
    gap: 6px;
    flex-wrap: wrap;
  }

  .data-product-chip {
    padding: 3px 8px;
    border: 1px solid var(--grid-line-soft);
    border-radius: 4px;
    background: #F7F8FA;
    color: #526074;
    font-size: 10.5px;
  }

  .product-accordion-content {
    padding: 0 40px 14px;
    gap: 10px;
    border-top: 1px solid var(--grid-line-soft);
  }

  .product-description {
    padding: 12px 0 0;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.6;
  }

  .product-list {
    width: 100%;
    border: 1px solid var(--grid-line-soft);
    border-radius: 0;
  }

  .product-row {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr);
    padding: 7px 10px;
    gap: 10px;
  }

  .mini-chip {
    width: 28px;
    border: 1px solid var(--grid-line-soft);
    border-radius: 3px;
    background: #F7F8FA;
    color: #526074;
  }

  .metadata-row {
    width: 100%;
    padding-left: 0;
    border-top: 1px solid var(--grid-line-soft);
    padding-top: 10px;
  }

  .metadata-chip {
    border-radius: 3px;
    background: #F7F8FA;
    color: var(--muted);
  }

  @media (max-width: 680px) {
    .product-catalog {
      border-radius: 0;
      background-image: linear-gradient(
        to right,
        transparent 39px,
        var(--grid-line-soft) 39px,
        var(--grid-line-soft) 40px,
        transparent 40px,
        transparent calc(100% - 40px),
        var(--grid-line-soft) calc(100% - 40px),
        var(--grid-line-soft) calc(100% - 39px),
        transparent calc(100% - 39px)
      );
    }

    .demo-wrap,
    .preview { max-width: 100%; }

    .grid-box {
      height: 320px;
      border-radius: 0;
      background-image: linear-gradient(
        to right,
        transparent 39px,
        var(--grid-line-soft) 39px,
        var(--grid-line-soft) 40px,
        transparent 40px,
        transparent calc(100% - 40px),
        var(--grid-line-soft) calc(100% - 40px),
        var(--grid-line-soft) calc(100% - 39px),
        transparent calc(100% - 39px)
      );
    }

    .grid-box::before,
    .grid-box::after { width: 40px; }

    .grid-box__art svg { width: 320px; }

    .catalog-intro { padding: 28px 56px 24px; }
    .catalog-categories { padding: 0; gap: 0; }

    .category-header { padding-inline: 56px; }
    .category-header::after { right: 40px; left: 40px; }
    .category-body-inner,
    .catalog-category.is-open .category-body-inner { padding-inline: 56px; }

    .product-accordion-header {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
    }

    .product-accordion-title {
      min-width: 0;
      align-self: center;
    }

    .data-product-chips {
      grid-column: 3;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-left: 0;
      flex-wrap: nowrap;
    }

    .product-accordion-header.chips-stacked .data-product-chips {
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
    }

    .product-accordion-header.chips-stacked .data-product-chip {
      justify-content: center;
    }

    .product-accordion-content { padding-inline: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .catalog-category,
    .category-body,
    .category-body-inner,
    .chevron {
      transition-duration: 0.01ms !important;
      transition-delay: 0ms !important;
    }
  }

</style>

  /* ---------- tooltip: elemento único, fora de qualquer overflow:hidden ---------- */
  var tooltipEl = document.createElement("div");
  tooltipEl.className = "chip-tooltip";
  tooltipEl.setAttribute("role", "tooltip");

  var tooltipArrow = document.createElement("div");
  tooltipArrow.className = "chip-tooltip__arrow";

  var tooltipTextEl = document.createElement("span");
  tooltipEl.appendChild(tooltipTextEl);
  tooltipEl.appendChild(tooltipArrow);
  document.body.appendChild(tooltipEl);

  var GAP = 10;

  function showTooltip(chip) {
    var text = chip.getAttribute("data-tooltip");
    if (!text) { return; }

    tooltipTextEl.textContent = text;
    tooltipEl.style.left = "0px";
    tooltipEl.style.top = "0px";
    tooltipEl.classList.add("is-visible");

    var chipRect = chip.getBoundingClientRect();
    var tipRect = tooltipEl.getBoundingClientRect();

    var left = chipRect.left + (chipRect.width / 2) - (tipRect.width / 2);
    var minLeft = 8;
    var maxLeft = window.innerWidth - tipRect.width - 8;
    left = Math.max(minLeft, Math.min(left, maxLeft));

    var top = chipRect.top - tipRect.height - GAP;

    tooltipEl.style.left = left + "px";
    tooltipEl.style.top = top + "px";

    var arrowLeft = (chipRect.left + chipRect.width / 2) - left;
    arrowLeft = Math.max(10, Math.min(arrowLeft, tipRect.width - 10));
    tooltipArrow.style.left = arrowLeft + "px";
    tooltipArrow.style.transform = "translateX(-50%) rotate(45deg)";
  }

  function hideTooltip() { tooltipEl.classList.remove("is-visible"); }

  function el(tag, className) {
    var node = document.createElement(tag);

  }

  function buildProductRow(product) {
    var row = el("div", "product-row");
    var type = product.type.toLowerCase();

    var chip = el("span", "mini-chip mini-chip--" + type);
    chip.textContent = product.type;
    row.appendChild(chip);

    var wrapper = el("div", "product-link-wrapper");
    var link = el("a", "product-name");
    link.href = "#";
    link.appendChild(document.createTextNode(product.name));

    var icon = el("span", "external-link-icon");
    icon.innerHTML = EXTERNAL_LINK;
    icon.setAttribute("aria-hidden", "true");
    link.appendChild(icon);

    link.setAttribute("aria-label", "Abrir referência de " + product.name + " em nova página");
    wrapper.appendChild(link);
    row.appendChild(wrapper);
    return row;
  }

    header.appendChild(title);

    item.products.forEach(function (product) {
      var chip = el("span", "data-product-chip data-product-chip--" + product.type.toLowerCase());

    header.appendChild(chips);

    header.addEventListener("click", function () {
      var expanded = header.getAttribute("aria-expanded") === "true";
      header.setAttribute("aria-expanded", expanded ? "false" : "true");
      content.hidden = expanded;
      chevron.innerHTML = expanded ? CHEVRON_RIGHT : CHEVRON_DOWN;
    });

    return accordion;
  }

  function buildGroup(group, theme) {
    var wrapper = el("div", "intermediate-group");
    if (group.title) {
      wrapper.classList.add("intermediate-group--titled");
      var title = el("div", "intermediate-group-title");
      title.textContent = group.title;
      title.style.color = theme.accent;
      wrapper.appendChild(title);
    }
    var accordionGroup = el("div", "product-accordion-group");
    group.items.forEach(function (item) {
      accordionGroup.appendChild(buildAccordion(item, theme));
    });
    wrapper.appendChild(accordionGroup);
    return wrapper;
  }

  function buildCategory(category) {
    var bodyId = nextId("category");
    var theme = THEME[category.key] || THEME.statement;

    var section = el("section", "catalog-category");

    var header = el("button", "category-header");
    header.type = "button";
    header.setAttribute("aria-expanded", "false");
    header.setAttribute("aria-controls", bodyId);

    var top = el("span", "category-header-top");

    var chevron = el("span", "chevron");
    chevron.innerHTML = CHEVRON_RIGHT;
    chevron.setAttribute("aria-hidden", "true");

    var summary = el("span", "category-summary");
    summary.appendChild(chevron);

    var iconBadge = el("span", "category-icon");
    iconBadge.style.color = ICON_ACCENT;
    iconBadge.innerHTML = ICONS[category.key] || ICONS.statement;
    iconBadge.setAttribute("aria-hidden", "true");
    summary.appendChild(iconBadge);

    var title = el("span", "category-title");
    title.textContent = category.title;
    summary.appendChild(title);

    var badge = el("span", "category-count-badge");
    badge.textContent = category.count;
    summary.appendChild(badge);

    top.appendChild(summary);

    header.appendChild(top);

    section.appendChild(header);

    var body = el("div", "category-body");
    body.id = bodyId;
    body.setAttribute("aria-hidden", "true");

    var bodyInner = el("div", "category-body-inner");

    var description = el("p", "category-description");
    description.textContent = category.description;
    bodyInner.appendChild(description);

    category.groups.forEach(function (group) {
      bodyInner.appendChild(buildGroup(group, theme));
    });

    body.appendChild(bodyInner);
    section.appendChild(body);

    header.addEventListener("click", function () {
      if (section.dataset.animating === "true") return;

      var expanded = header.getAttribute("aria-expanded") === "true";
      section.dataset.animating = "true";
      header.setAttribute("aria-expanded", expanded ? "false" : "true");
      body.setAttribute("aria-hidden", expanded ? "true" : "false");
      section.classList.toggle("is-open", !expanded);
      chevron.innerHTML = expanded ? CHEVRON_RIGHT : CHEVRON_DOWN;
      updateProductChipLayout();

      window.setTimeout(function () {
        section.dataset.animating = "false";
      }, 180);
    });

    return section;
  }

  var root = document.getElementById("catalog-categories");
  DATA.forEach(function (category) {
    root.appendChild(buildCategory(category));
  });

  /* Empilha chips somente nas linhas em que título + chips não cabem lado a lado. */
  var chipMeasureCanvas = document.createElement("canvas");
  var chipMeasureContext = chipMeasureCanvas.getContext("2d");
  var chipLayoutFrame = 0;

  function updateProductChipLayout() {
    window.cancelAnimationFrame(chipLayoutFrame);
    chipLayoutFrame = window.requestAnimationFrame(function () {
      var compact = window.matchMedia("(max-width: 680px)").matches;

      document.querySelectorAll(".product-accordion-header").forEach(function (productHeader) {
        productHeader.classList.remove("chips-stacked");
        if (!compact) return;

        var title = productHeader.querySelector(".product-accordion-title");
        var chips = productHeader.querySelector(".data-product-chips");
        var chevron = productHeader.querySelector(".chevron");
        if (!title || !chips || !chevron) return;

        var headerStyle = window.getComputedStyle(productHeader);
        var titleStyle = window.getComputedStyle(title);
        chipMeasureContext.font = titleStyle.font;

        var horizontalPadding = parseFloat(headerStyle.paddingLeft) + parseFloat(headerStyle.paddingRight);
        var availableWidth = productHeader.clientWidth - horizontalPadding - chevron.offsetWidth - 20;
        var titleWidth = Math.ceil(chipMeasureContext.measureText(title.textContent).width) + 4;
        var chipElements = Array.prototype.slice.call(chips.children);
        var chipsWidth = chipElements.reduce(function (total, chip) {
          return total + chip.offsetWidth;
        }, 0) + Math.max(0, chipElements.length - 1) * 6;

        productHeader.classList.toggle("chips-stacked", titleWidth + chipsWidth > availableWidth);
      });
    });
  }

  updateProductChipLayout();
  window.addEventListener("resize", updateProductChipLayout);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(updateProductChipLayout);
  }

  /* ---------- avisa o Archbee da própria altura ----------
     Este HTML roda num <iframe> de origem diferente, então o Archbee não
     consegue medir a altura de dentro por conta própria (bloqueio de
     segurança entre origens). Aqui a gente mede e avisa via postMessage
     sempre que o tamanho mudar — inclusive quando um accordion abre/fecha,
     graças ao ResizeObserver. */
  function reportHeight() {
    var frame = document.querySelector(".catalog-frame");
    var frameBottom = frame ? frame.getBoundingClientRect().bottom + 4 : 0;
    var height = Math.ceil(Math.max(
      frameBottom,
      document.body.scrollHeight,
      document.documentElement.scrollHeight
    ));
    window.parent.postMessage({ type: "klavi-catalog-resize", height: height }, "*");
  }

  reportHeight();

  var resizeObserver = new ResizeObserver(function () {
    reportHeight();
  });
  resizeObserver.observe(document.body);

  if (document.fonts) {
    document.fonts.ready.then(reportHeight);
  }
})();
</script>

</body>
</html>
