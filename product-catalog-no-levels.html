<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Catalog — redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink: #0F172A;
    --ink-soft: #425168;
    --muted: #64748B;
    --faint: #94A3B8;
    --border: #E7EBF1;
    --border-soft: #F0F2F6;
    --surface: #FFFFFF;
    --canvas: #FFFFFF;
    --hover-tint: #F8FAFC;
    --pf-bg: #EEF2FF;
    --pf-fg: #4338CA;
    --pj-bg: #FDF2F8;
    --pj-fg: #BE185D;
    --mono: 'JetBrains Mono', Menlo, monospace;
  }

  body {
    margin: 0;
    background: transparent;
    font-family: Inter, -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .preview { padding: 0; }

  /* ---------- raiz: fluida, não mais travada em 635px ---------- */
  .product-catalog {
    width: 100%;
    max-width: 760px;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 36px;
  }

  /* ---------- header ---------- */
  .catalog-intro { width: 100%; }

  .catalog-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #0047BB;
    margin: 0 0 10px;
  }

  .catalog-eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #0047BB;
  }

  .catalog-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin: 0;
    color: var(--ink);
  }

  .catalog-description {
    margin: 10px 0 0;
    max-width: 60ch;
    color: var(--muted);
    font-size: 15.5px;
    line-height: 1.65;
  }

  .catalog-stat {
    margin: 14px 0 0;
    font-size: 13px;
    color: var(--faint);
  }

  .catalog-stat strong { color: var(--ink-soft); font-weight: 600; }

  /* ---------- categorias ---------- */
  .catalog-categories {
    display: flex;
    width: 100%;
    flex-direction: column;
    align-items: flex-start;
    gap: 36px;
  }

  .catalog-category {
    display: flex;
    width: 100%;
    flex-direction: column;
    align-items: flex-start;
    gap: 18px;
  }

  .category-header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    align-self: stretch;
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
    text-align: left;
    border-radius: 10px;
  }

  .category-header:focus-visible {
    outline: 2px solid #0047BB;
    outline-offset: 6px;
  }

  .category-header-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .chevron {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: flex;
    color: var(--faint);
    transition: color 0.15s ease;
  }

  .category-icon {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .category-icon svg { width: 16px; height: 16px; }

  .category-title {
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .category-count-badge {
    display: flex;
    padding: 2px 9px;
    align-items: center;
    border-radius: 111px;
    background: var(--border-soft);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .category-header:hover .category-title { color: #0047BB; }
  .category-header:hover .chevron { color: var(--ink-soft); }

  .category-description {
    align-self: stretch;
    margin: 0 0 0 40px;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.6;
    max-width: 62ch;
  }

  .category-body {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    align-self: stretch;
    gap: 22px;
    padding-left: 40px;
  }

  .category-body[hidden] { display: none; }

  /* ---------- agrupamento intermediário ---------- */
  .intermediate-group {
    display: flex;
    width: 100%;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .intermediate-group-title {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--faint);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .intermediate-group-title::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
  }

  /* ---------- grupo de accordions ---------- */
  .product-accordion-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    align-self: stretch;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03), 0 2px 8px rgba(15, 23, 42, 0.04);
    overflow: hidden;
  }

  .product-accordion {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    align-self: stretch;
  }

  .product-accordion + .product-accordion { border-top: 1px solid var(--border-soft); }

  .product-accordion-header {
    display: flex;
    padding: 14px 16px;
    align-items: center;
    gap: 14px;
    align-self: stretch;
    background: none;
    border: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
    text-align: left;
    position: relative;
  }

  .product-accordion-header::before {
    content: "";
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: #0047BB;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .product-accordion-header:hover { background: var(--hover-tint); }
  .product-accordion-header:hover::before { opacity: 1; }
  .product-accordion-header:hover .product-accordion-title { color: #0047BB; }
  .product-accordion-header:hover .chevron { color: var(--ink-soft); }

  .product-accordion-header:focus-visible {
    outline: 2px solid #0047BB;
    outline-offset: -2px;
  }

  .product-accordion-title {
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    transition: color 0.15s ease;
  }

  .data-product-chips {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .data-product-chip {
    display: flex;
    padding: 4px 9px;
    align-items: center;
    border-radius: 111px;
    font-family: var(--mono);
    font-size: 11.5px;
    white-space: nowrap;
  }

  .data-product-chip--pf { background: var(--pf-bg); color: var(--pf-fg); }
  .data-product-chip--pj { background: var(--pj-bg); color: var(--pj-fg); }

  /* ---------- conteúdo aberto ---------- */
  .product-accordion-content {
    display: flex;
    padding: 4px 16px 18px 16px;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    align-self: stretch;
    background: #FFFFFF;
  }

  .product-accordion-content[hidden] { display: none; }

  .product-description {
    align-self: stretch;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.6;
    margin: 0;
    padding-left: 32px;
  }

  /* ---------- lista de produtos ---------- */
  .product-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    align-self: stretch;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    overflow: hidden;
  }

  .product-row {
    display: flex;
    align-items: center;
    gap: 12px;
    align-self: stretch;
    padding: 8px 12px;
    transition: background 0.1s ease;
  }

  .product-row + .product-row { border-top: 1px solid var(--border-soft); }
  .product-row:hover { background: var(--hover-tint); }

  .mini-chip {
    display: flex;
    width: 30px;
    padding: 3px 0;
    justify-content: center;
    align-items: center;
    border-radius: 111px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.01em;
    flex-shrink: 0;
  }

  .mini-chip--pf { background: var(--pf-bg); color: var(--pf-fg); }
  .mini-chip--pj { background: var(--pj-bg); color: var(--pj-fg); }

  .product-link-wrapper { display: flex; align-items: center; }

  .product-name {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 12px;
    text-decoration: none;
    border-radius: 4px;
  }

  .product-name:hover, .product-name:focus-visible { color: #0047BB; text-decoration: underline; }

  .product-name:focus-visible { outline: 2px solid #0047BB; outline-offset: 2px; }

  .external-link-icon { width: 11px; height: 11px; flex-shrink: 0; display: flex; opacity: 0.6; }

  /* ---------- metadados ---------- */
  .metadata-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 32px;
    flex-wrap: wrap;
  }

  .metadata-chip {
    display: flex;
    padding: 3px 10px;
    align-items: center;
    border-radius: 111px;
    background: var(--border-soft);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 500;
  }

  .level-chip { cursor: help; }

  .level-chip:focus-visible {
    outline: 2px solid #0047BB;
    outline-offset: 2px;
    border-radius: 111px;
  }

  /* ---------- tooltip: elemento único fora de qualquer overflow:hidden ---------- */
  .chip-tooltip {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    max-width: 240px;
    padding: 9px 11px;
    border-radius: 9px;
    background: var(--ink);
    color: #F1F5F9;
    font-family: Inter, sans-serif;
    font-size: 12px;
    line-height: 1.5;
    text-align: left;
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.22);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.12s ease;
  }

  .chip-tooltip.is-visible { opacity: 1; visibility: visible; }

  .chip-tooltip__arrow {
    position: absolute;
    bottom: -4px;
    width: 8px;
    height: 8px;
    background: var(--ink);
    transform: translateX(-50%) rotate(45deg);
  }
</style>
</head>
<body>

  <section class="product-catalog">

      <p class="catalog-stat" id="catalog-stat"></p>
    </div>

    <div class="catalog-categories" id="catalog-categories"></div>

  </section>
</div>

      ]
    },
    {
      key: "market",
      title: "Inteligência de mercado",
      count: 3,
      description: "Variáveis que ajudam a identificar posse de produtos, padrões de comportamento, ciclo de vida e principalidade da conta.",
      groups: [
        {
          items: [
            { title: "Produtos financeiros", level: "User-level", variables: "105 variáveis", description: "Variáveis de produtos financeiros: transações, produtos e serviços contratados e saldos de conta corrente ou poupança.", products: [{ type: "PF", name: "pf_financial_products" }] },
            { title: "Produtos não financeiros", level: "User-level", variables: "56 variáveis", description: "Variáveis de produtos não financeiros derivadas de dados transacionais de serviços essenciais e estilo de vida.", products: [{ type: "PF", name: "pf_non_financial_products" }] },
            { title: "Principalidade", level: "Institution-level", description: "Modelo de score que indica o nível de principalidade da conta na instituição conectada.", products: [{ type: "PF", name: "pf_principality" }] }
          ]
        }
      ]
    },
    {
      key: "kyc",
      title: "KYC",
      count: 1,
      description: "Dados de identidade e cadastro de pessoas físicas e jurídicas, incluindo informações declaradas disponíveis via Open Finance.",
      groups: [
        {
          items: [
            { title: "Identidade", level: "Institution-level", description: "Dados de identidade e cadastro disponíveis via Open Finance, como informações declaradas de PF ou PJ.", products: [{ type: "PF", name: "pf_identity" }, { type: "PJ", name: "pj_identity" }] }
          ]
        }
      ]
    }
  ];

  var uid = 0;
  function nextId(prefix) { uid += 1; return prefix + "-" + uid; }

  /* ---------- tooltip: elemento único, fora de qualquer overflow:hidden ---------- */
  var tooltipEl = document.createElement("div");
  tooltipEl.className = "chip-tooltip";
  tooltipEl.setAttribute("role", "tooltip");

  var tooltipArrow = document.createElement("div");
  tooltipArrow.className = "chip-tooltip__arrow";

  var tooltipTextEl = document.createElement("span");
  tooltipEl.appendChild(tooltipTextEl);
  tooltipEl.appendChild(tooltipArrow);
  document.body.appendChild(tooltipEl);

  var GAP = 10;

  function showTooltip(chip) {
    var text = chip.getAttribute("data-tooltip");
    if (!text) { return; }

    tooltipTextEl.textContent = text;
    tooltipEl.style.left = "0px";
    tooltipEl.style.top = "0px";
    tooltipEl.classList.add("is-visible");

    var chipRect = chip.getBoundingClientRect();
    var tipRect = tooltipEl.getBoundingClientRect();

    var left = chipRect.left + (chipRect.width / 2) - (tipRect.width / 2);
    var minLeft = 8;
    var maxLeft = window.innerWidth - tipRect.width - 8;
    left = Math.max(minLeft, Math.min(left, maxLeft));

    var top = chipRect.top - tipRect.height - GAP;

    tooltipEl.style.left = left + "px";
    tooltipEl.style.top = top + "px";

    var arrowLeft = (chipRect.left + chipRect.width / 2) - left;
    arrowLeft = Math.max(10, Math.min(arrowLeft, tipRect.width - 10));
    tooltipArrow.style.left = arrowLeft + "px";
    tooltipArrow.style.transform = "translateX(-50%) rotate(45deg)";
  }

  function hideTooltip() { tooltipEl.classList.remove("is-visible"); }

  function el(tag, className) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    return node;
  }

  function buildProductRow(product) {
    var row = el("div", "product-row");
    var type = product.type.toLowerCase();

    var chip = el("span", "mini-chip mini-chip--" + type);
    chip.textContent = product.type;
    row.appendChild(chip);

    var wrapper = el("div", "product-link-wrapper");
    var link = el("a", "product-name");
    link.href = "#";
    link.appendChild(document.createTextNode(product.name));

    var icon = el("span", "external-link-icon");
    icon.innerHTML = EXTERNAL_LINK;
    icon.setAttribute("aria-hidden", "true");
    link.appendChild(icon);

    link.setAttribute("aria-label", "Abrir referência de " + product.name + " em nova página");
    wrapper.appendChild(link);
    row.appendChild(wrapper);
    return row;
  }

  function buildAccordion(item, theme) {
    var panelId = nextId("panel");
    var accordion = el("div", "product-accordion");

    var header = el("button", "product-accordion-header");
    header.type = "button";
    header.setAttribute("aria-expanded", "false");
    header.setAttribute("aria-controls", panelId);

    var chevron = el("span", "chevron");
    chevron.innerHTML = CHEVRON_RIGHT;
    chevron.setAttribute("aria-hidden", "true");
    header.appendChild(chevron);

    var title = el("span", "product-accordion-title");
    title.textContent = item.title;
    header.appendChild(title);

    var chips = el("div", "data-product-chips");
    item.products.forEach(function (product) {
      var chip = el("span", "data-product-chip data-product-chip--" + product.type.toLowerCase());
      chip.textContent = product.name;
      chips.appendChild(chip);
    });
    header.appendChild(chips);

    accordion.appendChild(header);

    var content = el("div", "product-accordion-content");
    content.id = panelId;
    content.hidden = true;

    var description = el("p", "product-description");
    description.textContent = item.description;
    content.appendChild(description);

    var list = el("div", "product-list");
    item.products.forEach(function (product) {
      list.appendChild(buildProductRow(product));
    });
    content.appendChild(list);

    var metadata = el("div", "metadata-row");
    if (item.level) {
      var levelTooltips = {
        "User-level": "Consolida informações entre múltiplas instituições conectadas pelo mesmo usuário.",
        "Institution-level": "Retorna dados da conta de um usuário em uma instituição financeira específica."
      };
      var levelTooltipText = levelTooltips[item.level] || "";

      var levelChip = el("span", "metadata-chip level-chip");
      levelChip.textContent = item.level;
      if (levelTooltipText) {
        levelChip.setAttribute("data-tooltip", levelTooltipText);
        levelChip.setAttribute("tabindex", "0");
        levelChip.setAttribute("aria-label", item.level + " — " + levelTooltipText);
        levelChip.addEventListener("mouseenter", function () { showTooltip(levelChip); });
        levelChip.addEventListener("mouseleave", hideTooltip);
        levelChip.addEventListener("focus", function () { showTooltip(levelChip); });
        levelChip.addEventListener("blur", hideTooltip);
      }
      metadata.appendChild(levelChip);
    }
    if (item.variables) {
      var varsChip = el("span", "metadata-chip");
      varsChip.textContent = item.variables;
      metadata.appendChild(varsChip);
    }
    if (metadata.childNodes.length) { content.appendChild(metadata); }

    accordion.appendChild(content);

    header.addEventListener("click", function () {
      var expanded = header.getAttribute("aria-expanded") === "true";
      header.setAttribute("aria-expanded", expanded ? "false" : "true");
      content.hidden = expanded;
      chevron.innerHTML = expanded ? CHEVRON_RIGHT : CHEVRON_DOWN;
    });

    return accordion;
  }

  function buildGroup(group, theme) {
    var wrapper = el("div", "intermediate-group");
    if (group.title) {
      var title = el("div", "intermediate-group-title");
      title.textContent = group.title;
      title.style.color = theme.accent;
      wrapper.appendChild(title);
    }
    var accordionGroup = el("div", "product-accordion-group");
    group.items.forEach(function (item) {
      accordionGroup.appendChild(buildAccordion(item, theme));
    });
    wrapper.appendChild(accordionGroup);
    return wrapper;
  }

  function buildCategory(category) {
    var bodyId = nextId("category");
    var theme = THEME[category.key] || THEME.statement;

    var section = el("section", "catalog-category");

    var header = el("button", "category-header");
    header.type = "button";
    header.setAttribute("aria-expanded", "false");
    header.setAttribute("aria-controls", bodyId);

    var top = el("span", "category-header-top");

    var chevron = el("span", "chevron");
    chevron.innerHTML = CHEVRON_RIGHT;
    chevron.setAttribute("aria-hidden", "true");
    top.appendChild(chevron);

    var iconBadge = el("span", "category-icon");
    iconBadge.style.background = theme.tint;
    iconBadge.style.color = theme.accent;
    iconBadge.innerHTML = ICONS[category.key] || ICONS.statement;
    iconBadge.setAttribute("aria-hidden", "true");
    top.appendChild(iconBadge);

    var title = el("span", "category-title");
    title.textContent = category.title;
    top.appendChild(title);

    var badge = el("span", "category-count-badge");
    badge.textContent = category.count;
    top.appendChild(badge);

    header.appendChild(top);

    var description = el("span", "category-description");
    description.textContent = category.description;
    header.appendChild(description);

    section.appendChild(header);

    var body = el("div", "category-body");
    body.id = bodyId;
    body.hidden = true;

    category.groups.forEach(function (group) {
      body.appendChild(buildGroup(group, theme));
    });

    section.appendChild(body);

    header.addEventListener("click", function () {
      var expanded = header.getAttribute("aria-expanded") === "true";
      header.setAttribute("aria-expanded", expanded ? "false" : "true");
      body.hidden = expanded;
      chevron.innerHTML = expanded ? CHEVRON_RIGHT : CHEVRON_DOWN;
    });

    return section;
  }

  var root = document.getElementById("catalog-categories");
  DATA.forEach(function (category) {
    root.appendChild(buildCategory(category));
  });

  var totalProducts = DATA.reduce(function (sum, cat) { return sum + cat.count; }, 0);
  document.getElementById("catalog-stat").innerHTML =
    "<strong>" + totalProducts + "</strong> produtos em <strong>" + DATA.length + "</strong> categorias";
})();
</script>
